name: Daily Power Policy Watcher

on:
  # schedule:
  #   - cron: "0 20 * * *"   # UTC 20:00 = JST 05:00
  #   - cron: "0 2 * * *"    # UTC 02:00 = JST 11:00
  #   - cron: "0 6 * * *"    # UTC 06:00 = JST 15:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUMMARIZER_MODE: ${{ vars.SUMMARIZER_MODE || 'none' }}
          CLASSIFIER_MODE: ${{ vars.CLASSIFIER_MODE || 'keyword' }}
        run: python main.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "chore: update history.json [skip ci]"
          git push
