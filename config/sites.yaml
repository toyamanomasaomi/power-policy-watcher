sites:
  - name: 資源エネルギー庁
    url: https://www.enecho.meti.go.jp/category/electricity_and_gas/electric/summary/
    base_url: https://www.enecho.meti.go.jp
    # 要素が変わった場合は list_selector / title_selector / link_selector を調整する
    list_selector: "ul.newsList li"
    title_selector: "a"
    link_selector: "a"
    excerpt_selector: null

  - name: OCCTO（広域的運営推進機関）
    url: https://www.occto.or.jp/news/
    base_url: https://www.occto.or.jp
    list_selector: "a.linklist-cms01__link"
    title_selector: "span"
    link_selector: null
    excerpt_selector: null

  - name: テスト用（Hacker News）
    url: https://news.ycombinator.com/
    base_url: https://news.ycombinator.com
    list_selector: "tr.athing"
    title_selector: "span.titleline > a"
    link_selector: "span.titleline > a"
    excerpt_selector: null

  - name: 電力・ガス取引監視等委員会
    url: https://www.egc.meti.go.jp/info/public/
    base_url: https://www.egc.meti.go.jp
    list_selector: "table.infoTable tr"
    title_selector: "td a"
    link_selector: "td a"
    excerpt_selector: null
